<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Letter For Miss Rudyy ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#101827;color:#f8e8ed;font-family:Georgia,serif;transition:background .5s}
header{text-align:center;padding:22px 12px 0}h1{color:#ff79a8;font-size:clamp(1.3rem,4vw,1.8rem);margin:0 0 14px}.sub{color:#d8c5d5;font-style:italic;margin:0 0 18px}
h2{text-align:center;color:#ff79a8;font-size:clamp(1.05rem,3.5vw,1.45rem);line-height:1.4;padding:12px 14px;margin:8px 0}
main{width:min(100% - 24px,1000px);margin:auto;flex:1;display:flex;min-height:0}
#message{width:100%;overflow-y:auto;white-space:pre-wrap;text-align:center;line-height:1.9;font-size:clamp(1rem,2.4vw,1.12rem);padding:16px clamp(8px,5vw,45px) 30px;overflow-wrap:anywhere;scrollbar-color:#ff79a8 #252033}
.final{display:block;color:#ff79a8;font-size:clamp(1.05rem,3vw,1.3rem);font-weight:bold;line-height:1.8}
footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px clamp(10px,4vw,40px) 18px;flex-wrap:wrap}
button{border:0;border-radius:5px;padding:12px 22px;font:bold 12pt Arial;cursor:pointer}#previous{background:#454052;color:white}#next{background:#ff79a8;color:#251626}button:hover{filter:brightness(1.08)}#counter{color:#d9c5d5;font:11pt Arial;text-align:center;flex:1}
@media(max-width:520px){header{padding-top:18px}#message{line-height:1.75;padding-inline:8px}footer{justify-content:center}#counter{order:-1;flex-basis:100%}button{padding:12px 16px}}
</style></head><body>
<header><h1>A LETTER FROM THE HEART</h1><p class="sub">Some feelings are difficult to explain...</p></header>
<h2 id="title"></h2><main><section id="message" aria-live="polite"></section></main>
<footer><button id="previous">← Previous</button><span id="counter"></span><button id="next">Continue →</button></footer>
<script>
const slides=[["A LITTLE QUESTION FOR YOU 🌷", "Hey, Miss Rudyy!\n\nSo, tell me something...\n\nHow was your birthday?\n\nDid you enjoy your day?\nDid something make you smile?\nDid everything go the way you expected?\n\nI genuinely hope your day was beautiful\nand filled with little moments of happiness.\n\nAnd if you want to share your day with me,\nI'm here to listen.\n\nAgar dost maanti ho mujhe,\ntoh sachhe dil se apna din share karna.\n\nAnd if you don't feel like sharing,\nthat's completely okay too.\n\nI just hope your birthday was better\nthan you expected.\n\nYou deserved a beautiful day. ❤️"], ["WHAT SHOULD I CALL THIS FEELING? 💌", "Honestly, I don't know what this feeling is.\n\nI don't even know what to call it.\nMaybe attachment, maybe affection,\nor maybe something I should call\nONE-SIDED LOVE.\n\nI'm tired of feeling like I'm the only one\ntrying to keep this connection alive.\n\nI know you once told me that you\ndon't feel anything like that\nand wanted things to stay casual.\n\nBut somehow, I couldn't keep my feelings casual.\n\nI never planned to fall for someone.\nI wasn't even looking for love.\n\nAnd then I found you.\n\nYou became the first person\nto whom I gave so much of my time,\nmy tears, my heart and my attention.\n\nI know you might wonder:\nHow can someone fall for a person\nthey met through an online platform?\n\nFor real, I don't know either.\n\nYou made me feel butterflies\nwhen I least expected them.\n\nWe have shared almost a year of friendship.\nSometimes you disappeared,\nsometimes you came back,\nand somehow I kept hoping\nthat we would stay connected.\n\nI know I became too attached.\nI know I feared losing you,\neven when I wasn't sure\nwhether I had a place in your life.\n\nMaybe I was searching for a kind of love\nand care that I had missed elsewhere.\n\nAnd perhaps I expected too much.\n\nBut I'm genuinely glad\nthat I found you in this lifetime.\n\nThank you for making me feel loved,\neven if things didn't mean the same\nto both of us."], ["I THINK IT'S TIME TO STEP BACK 🌙", "I think this is where I need to make\na difficult decision.\n\nMaybe this is my last time\nwriting to you first.\n\nI tried being a friend.\nI really tried.\n\nSometimes I even begged\nfor the smallest amount of attention.\n\nBut I don't want to keep forcing\na connection that should feel natural.\n\nI'm going to try not to text first anymore.\n\nNot because I hate you.\nNot because I want revenge.\n\nBut because I need to take care\nof my own feelings too.\n\nIf you ever text me,\nI won't pretend you don't exist.\nI'll always appreciate hearing from you.\n\nAnd whatever you decide,\nI'll respect it.\n\nI hope my distance brings you peace.\nI hope you find your freedom.\n\nMaybe my chapter in your life\nends here.\n\nBut please know,\nI genuinely wish you the happiest days,\nfull of laughter, opportunities\nand beautiful memories.\n\nWithout any burden,\nwithout any expectations,\nand without someone like me\nmaking things difficult for you.\n\nI tried, Rudy.\nI really did."], ["YOUR ABSENCE HURTS DIFFERENTLY 🥀", "Your absence hurts more\nthan your presence ever did.\n\nAnd yes, I'm sorry if I disturbed\nyour peaceful moments.\n\nI'll survive it.\nI'll slowly learn to live\nwith the silence between us.\n\nBut I don't know how long\nit will take me to let go.\n\nMaine tumse pehle bhi kaha tha,\naaj bhi kehta hoon...\n\n\"Main kisi ko nahi chhodta,\nlog hi aksar mujhe chhod jaate hain.\"\n\nEarlier, losing people didn't affect me\nthis much.\n\nBut losing you?\nThat is going to hurt differently.\n\nSometimes you talked to me\nearly in the morning,\nsometimes during the day,\nsometimes in the evening,\nsometimes late at night,\nand sometimes until 11.\n\nAnd you know what?\n\nMaybe you became my 11:11 wish.\n\nA wish I kept making,\neven when I knew\nit might never come true.\n\nI don't know whether you'll miss me.\nI don't know whether you'll notice\nmy silence.\n\nBut I'll always remember\nthe little conversations,\nthe random moments\nand the happiness you brought.\n\nI hope life treats you gently, Rudy.\n\nAnd I hope you always have\na reason to smile. ❤️"], ["HEY, MISS RUDYY... ❤️", "There is just one last thing\nI want you to know.\n\nI don't regret meeting you.\n\nI don't regret the time,\nthe conversations,\nthe laughter or even the tears.\n\nYou were special to me.\n\nMaybe I'll always carry\na little part of this story\nin my heart.\n\nBut I also want to learn\nto love myself,\nto make new memories,\nand to find happiness\nwithout depending on one person.\n\nThank you for everything.\n\nFor the butterflies,\nfor the memories,\nfor the smiles,\nand even for teaching me\nhow much feelings can hurt.\n\nI hope you find everything\nyour heart has ever wished for.\n\nBe happy, Miss Rudyy.\n\nAlways. 🌷"]];
const closing=["𝐇𝐞𝐲!", "𝐌", "𝐌𝐢", "𝐌𝐢𝐬", "𝐌𝐢𝐬 𝐑", "𝐌𝐢𝐬 𝐑𝐮", "𝐌𝐢𝐬 𝐑𝐮𝐝", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋𝐨", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋𝐨𝐯", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋𝐨𝐯𝐞", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋𝐨𝐯𝐞𝐝", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋𝐨𝐯𝐞𝐝 𝐘", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋𝐨𝐯𝐞𝐝 𝐘𝐨", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋𝐨𝐯𝐞𝐝 𝐘𝐨𝐮", "𝐌𝐢𝐬 𝐑𝐮𝐝𝐲𝐲 𝐈 𝐋𝐨𝐯𝐞𝐝 𝐘𝐨𝐮 😭"];
const backgrounds=["#101827","#21152e","#182333","#101522","#251626"];
const textColors=["#f8e8ed","#ffe4ed","#e5eaff","#f7e5ed","#ffe5ee"];
let current=0,token=0;
const title=document.getElementById("title"),message=document.getElementById("message"),counter=document.getElementById("counter"),prev=document.getElementById("previous"),next=document.getElementById("next");
function showSlide(i){current=i;token++;let t=token,bg=backgrounds[i];document.body.style.background=bg;title.textContent=slides[i][0];title.style.background=bg;message.style.background=bg;message.style.color=textColors[i];message.textContent=slides[i][1];message.scrollTop=0;counter.textContent=`CHAPTER ${i+1} / 5`;prev.hidden=i===0;
if(i===4){next.textContent="Close Letter ✨";next.onclick=()=>{document.body.innerHTML='<p style="margin:auto;text-align:center;color:#ff79a8;font:24px Georgia">Thank you for reading ❤️</p>';};setTimeout(()=>animate(0,t),1000)}
else{next.textContent="Continue →";next.onclick=()=>showSlide(Math.min(4,current+1));}}
function animate(i,t){if(t!==token||current!==4||i>=closing.length)return;let s=document.createElement("span");s.className="final";s.textContent=closing[i];message.append(document.createElement("br"),s);message.scrollTop=message.scrollHeight;setTimeout(()=>animate(i+1,t),350)}
prev.onclick=()=>{if(current>0)showSlide(current-1)};showSlide(0);
</script></body></html>
